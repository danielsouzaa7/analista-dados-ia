# Só configuração de ferramentas; o projeto não é empacotado.
[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["sandbox", "static", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]  # 11 linhas longas pré-existentes; não vale mexer em código que outros estão revisando

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["app"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.File"]
