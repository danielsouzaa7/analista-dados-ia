name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  DENO_VERSION: "2.9.8" # a mesma do Dockerfile

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - run: pip install -r requirements-dev.txt

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: ${{ env.DENO_VERSION }}

      # Pyodide e pandas ficam em cache: o sandbox roda sem rede.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            sandbox/node_modules
            sandbox/pyodide_cache
          key: pyodide-${{ runner.os }}-${{ env.DENO_VERSION }}-${{ hashFiles('sandbox/deno.lock') }}

      - name: Prepara o sandbox (baixa o Pyodide quando não há cache)
        working-directory: sandbox
        run: |
          deno install --entrypoint runner.ts
          deno run --allow-read --allow-write=./pyodide_cache,./node_modules --allow-net runner.ts --preparar

      - name: Extensão Postgres do DuckDB
        run: python -c "import duckdb; duckdb.sql('INSTALL postgres')"

      - run: ruff check .

      - name: Testes do front (JS)
        run: deno test --allow-read tests/js/

      # Sem PG_TEST_URL: o teste de Postgres real é pulado (roda no job abaixo). Não chama o LLM.
      - run: pytest -q --cov=app --cov-report=term-missing

  postgres-real:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: teste
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PG_TEST_URL: postgresql://postgres:teste@127.0.0.1:5432/postgres
      PG_PERMITIR_INTERNO: "1"  # o Postgres do job é local
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - run: pip install -r requirements-dev.txt

      - name: Extensão Postgres do DuckDB
        run: python -c "import duckdb; duckdb.sql('INSTALL postgres')"

      - name: Cria a tabela do teste
        run: >-
          PGPASSWORD=teste psql -h 127.0.0.1 -U postgres -c
          "create table vendas_pg(v int); insert into vendas_pg values (1),(2),(3);"

      - run: pytest -q tests/test_sql_tool.py

  # Depende do jsDelivr ao vivo (Pyodide no navegador): não bloqueia o merge.
  e2e-navegador:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - run: pip install -r requirements-dev.txt

      - run: playwright install --with-deps chromium firefox webkit

      - run: E2E_PYODIDE=1 pytest tests/e2e/test_python_worker.py tests/e2e/test_python_navegador.py -q
