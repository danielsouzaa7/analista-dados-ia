services:
  - type: web
    name: analista-dados-ia
    runtime: docker
    plan: free
    healthCheckPath: /api/status
    autoDeploy: true
    envVars:
      - key: PORT
        value: "7860" # o Dockerfile escuta na 7860
      - key: LLM_API_KEY
        sync: false # o Render pede o valor na tela; nunca entra no git
