<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 668" width="400" height="668" role="img" aria-labelledby="t d"><title id="t">Orquestração: pico de contexto por sessão do orquestrador e pico máximo por papel de agente</title><desc id="d">Barras com o pico de contexto de cada sessão do orquestrador e o pico máximo por papel de agente, com a linha da zona de genialidade em 300.000 tokens. 58 agentes geraram 2.027.193 tokens de saída; o orquestrador gerou 582.779 (razão 3,5x). 57 agentes ficaram na zona de genialidade e 1 passou dela. Pico do orquestrador: 505.062 tokens. No máximo 5 agentes simultâneos.</desc><style>.s{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.m{font-family:ui-monospace,"Cascadia Mono",Consolas,monospace}.b{transform-box:fill-box;transform-origin:0 50%;animation:g .8s ease-out backwards}@keyframes g{from{transform:scaleX(0)}}@media (prefers-reduced-motion:reduce){.b{animation:none}}</style><rect width="400" height="668" rx="14" fill="#131C2E"/><text class="s" x="20" y="34" font-size="17" font-weight="700" fill="#E6EDF3">58 agentes: 2,0 mi tokens</text><text class="s" x="20" y="54" font-size="13" fill="#E6EDF3">orquestrador: 583 mil tokens</text><text class="s" x="20" y="78" font-size="11" fill="#8B949E">Razão 3,5x em tokens gerados. Cada barra é o pico</text><text class="s" x="20" y="93" font-size="11" fill="#8B949E">de contexto: 57 agentes dentro da zona de</text><text class="s" x="20" y="108" font-size="11" fill="#8B949E">genialidade, 1 acima.</text><text class="s" x="20" y="127" font-size="11" fill="#C9D1D9">Orquestrador: pico de 505.062 tokens, 3</text><text class="s" x="20" y="142" font-size="11" fill="#C9D1D9">compactações. Até 5 agentes ao mesmo tempo</text><text class="s" x="20" y="157" font-size="11" fill="#C9D1D9">(estimado).</text><text class="s" x="20" y="176" font-size="11" fill="#A371F7">Agent loop (estimado): 7 ciclos de revisão, 5</text><text class="s" x="20" y="191" font-size="11" fill="#A371F7">reimplementações; 0 agentes no papel Crítico.</text><text class="s" x="20" y="230" font-size="12" font-weight="700" fill="#E6EDF3">Orquestrador, pico por sessão</text><text class="s" x="20" y="244" font-size="11" fill="#E6EDF3">sessão 1</text><text class="m" x="380" y="244" text-anchor="end" font-size="10" fill="#8B949E">311.740</text><rect class="b" style="animation-delay:0.05s" x="20" y="249" width="182.2" height="7" rx="2" fill="#E6EDF3"/><text class="s" x="20" y="270" font-size="11" fill="#E6EDF3">sessão 2</text><text class="m" x="380" y="270" text-anchor="end" font-size="10" fill="#8B949E">78.885</text><rect class="b" style="animation-delay:0.10s" x="20" y="275" width="46.1" height="7" rx="2" fill="#E6EDF3"/><text class="s" x="20" y="296" font-size="11" fill="#E6EDF3">sessão 3</text><text class="m" x="380" y="296" text-anchor="end" font-size="10" fill="#8B949E">398.116</text><rect class="b" style="animation-delay:0.15s" x="20" y="301" width="232.7" height="7" rx="2" fill="#E6EDF3"/><text class="s" x="20" y="322" font-size="11" fill="#E6EDF3">sessão 4</text><text class="m" x="380" y="322" text-anchor="end" font-size="10" fill="#8B949E">81.295</text><rect class="b" style="animation-delay:0.20s" x="20" y="327" width="47.5" height="7" rx="2" fill="#E6EDF3"/><text class="s" x="20" y="348" font-size="11" fill="#E6EDF3">sessão 5</text><text class="m" x="380" y="348" text-anchor="end" font-size="10" fill="#8B949E">82.956</text><rect class="b" style="animation-delay:0.25s" x="20" y="353" width="48.5" height="7" rx="2" fill="#E6EDF3"/><text class="s" x="20" y="374" font-size="11" fill="#E6EDF3">sessão 6</text><text class="m" x="380" y="374" text-anchor="end" font-size="10" fill="#8B949E">505.062</text><rect class="b" style="animation-delay:0.30s" x="20" y="379" width="295.2" height="7" rx="2" fill="#E6EDF3"/><text class="s" x="20" y="400" font-size="11" fill="#E6EDF3">sessão 7</text><text class="m" x="380" y="400" text-anchor="end" font-size="10" fill="#8B949E">82.411</text><rect class="b" style="animation-delay:0.35s" x="20" y="405" width="48.2" height="7" rx="2" fill="#E6EDF3"/><text class="s" x="20" y="428" font-size="12" font-weight="700" fill="#E6EDF3">Agentes, pico máximo por papel</text><text class="s" x="20" y="446" font-size="11" fill="#58A6FF">Implementador (26)</text><text class="m" x="380" y="446" text-anchor="end" font-size="10" fill="#8B949E">215.459</text><rect class="b" style="animation-delay:0.40s" x="20" y="451" width="125.9" height="7" rx="2" fill="#58A6FF"/><text class="s" x="20" y="472" font-size="11" fill="#A371F7">Revisor (12)</text><text class="m" x="380" y="472" text-anchor="end" font-size="10" fill="#8B949E">160.096</text><rect class="b" style="animation-delay:0.45s" x="20" y="477" width="93.6" height="7" rx="2" fill="#A371F7"/><text class="s" x="20" y="498" font-size="11" fill="#A371F7">Engenheiro de segurança (7)</text><text class="m" x="380" y="498" text-anchor="end" font-size="10" fill="#8B949E">163.876</text><rect class="b" style="animation-delay:0.50s" x="20" y="503" width="95.8" height="7" rx="2" fill="#A371F7"/><text class="s" x="20" y="524" font-size="11" fill="#39C5CF">Arquiteto (4)</text><text class="m" x="380" y="524" text-anchor="end" font-size="10" fill="#8B949E">225.163</text><rect class="b" style="animation-delay:0.55s" x="20" y="529" width="131.6" height="7" rx="2" fill="#39C5CF"/><text class="s" x="20" y="550" font-size="11" fill="#39C5CF">Planejador (1)</text><text class="m" x="380" y="550" text-anchor="end" font-size="10" fill="#8B949E">210.120</text><rect class="b" style="animation-delay:0.60s" x="20" y="555" width="122.8" height="7" rx="2" fill="#39C5CF"/><text class="s" x="20" y="576" font-size="11" fill="#39C5CF">QA (2)</text><text class="m" x="380" y="576" text-anchor="end" font-size="10" fill="#8B949E">117.641</text><rect class="b" style="animation-delay:0.65s" x="20" y="581" width="68.8" height="7" rx="2" fill="#39C5CF"/><text class="s" x="20" y="602" font-size="11" fill="#39C5CF">Documentador (3)</text><text class="m" x="380" y="602" text-anchor="end" font-size="10" fill="#8B949E">134.541</text><rect class="b" style="animation-delay:0.70s" x="20" y="607" width="78.6" height="7" rx="2" fill="#39C5CF"/><text class="s" x="20" y="628" font-size="11" fill="#8B949E">Agente geral (3)</text><text class="m" x="380" y="628" text-anchor="end" font-size="10" fill="#8B949E">315.969</text><rect class="b" style="animation-delay:0.75s" x="20" y="633" width="184.7" height="7" rx="2" fill="#8B949E"/><rect x="20" y="224" width="175.4" height="430" fill="#3FB950" opacity=".08"/><line x1="195.4" y1="218" x2="195.4" y2="654" stroke="#3FB950" stroke-width="1.5" stroke-dasharray="5 4"/><text class="s" x="191.4" y="214" text-anchor="end" font-size="10" fill="#3FB950">zona de genialidade: até 300.000</text></svg>