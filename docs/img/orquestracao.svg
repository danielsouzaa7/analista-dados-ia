<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1046" width="1200" height="1046" role="img" aria-labelledby="t d"><title id="t">Orquestração: pico de contexto de cada agente e de cada sessão do orquestrador</title><desc id="d">Barras com o pico de contexto de cada sessão do orquestrador e de cada agente, agrupados por papel, com a linha da zona de genialidade em 300.000 tokens. 58 agentes geraram 2.027.193 tokens de saída; o orquestrador gerou 582.779 (razão 3,5x). 57 agentes ficaram na zona de genialidade e 1 passou dela. Pico do orquestrador: 505.062 tokens. No máximo 5 agentes simultâneos.</desc><style>.s{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.m{font-family:ui-monospace,"Cascadia Mono",Consolas,monospace}.b{transform-box:fill-box;transform-origin:0 50%;animation:g .8s ease-out backwards}@keyframes g{from{transform:scaleX(0)}}@media (prefers-reduced-motion:reduce){.b{animation:none}}</style><rect width="1200" height="1046" rx="14" fill="#131C2E"/><text class="s" x="40" y="44" font-size="22" font-weight="700" fill="#E6EDF3">58 agentes geraram 2,0 mi tokens; o orquestrador, 583 mil</text><text class="s" x="40" y="70" font-size="14" fill="#8B949E">Razão 3,5x em tokens gerados. Cada barra é o pico de contexto: 57 agentes dentro da zona de genialidade, 1 acima.</text><text class="s" x="40" y="92" font-size="14" fill="#C9D1D9">Orquestrador: pico de 505.062 tokens, 3 compactações. Até 5 agentes ao mesmo tempo (estimado).</text><text class="s" x="40" y="114" font-size="14" fill="#A371F7">Agent loop (estimado): 7 ciclos de revisão, 5 reimplementações; 0 agentes no papel Crítico.</text><rect x="230" y="178" width="509.1" height="848" fill="#3FB950" opacity=".08"/><line x1="739.1" y1="170" x2="739.1" y2="1026" stroke="#3FB950" stroke-width="1.5" stroke-dasharray="5 4"/><text class="s" x="745.1" y="166" font-size="12" fill="#3FB950">zona de genialidade: até 300.000 tokens</text><text class="s" x="40" y="176" font-size="13" font-weight="700" fill=