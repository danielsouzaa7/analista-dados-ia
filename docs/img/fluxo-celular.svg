<rect class="box" x="45" y="520" width="510" height="262" rx="14" stroke="#39C5CF"/><rect class="box h w3" x="45" y="520" width="510" height="262" rx="14" stroke="#39C5CF" stroke-width="4" opacity=".6"/><text x="61" y="546" font-size="19" class="b" style="fill:#39C5CF">Web Worker · Pyodide</text><rect x="61" y="558" width="478" height="77" rx="8" fill="#0E1626" stroke="#25324A" stroke-width="1.5"/><g class="cd"><text x="73" y="582" font-size="15" class="mo" style="fill:#C9D1D9">com = df[df.cupom].valor_pedido</text><text x="73" y="603" font-size="15" class="mo" style="fill:#C9D1D9">sem = df[~df.cupom].valor_pedido</text><text x="73" y="624" font-size="15" class="mo" style="fill:#39C5CF">r = teste_t_welch(com, sem)</text></g><text x="61" y="659" font-size="16" class="b st" style="fill:#39C5CF">rodando Python</text><rect x="61" y="667" width="478" height="8" rx="4" fill="#25324A"/><rect class="bar" x="61" y="667" width="478" height="8" rx="4" fill="#39C5CF"/><g class="net"><path d="M61 707H323" stroke="#39C5CF" stroke-width="2.5" stroke-dasharray="6 5"/></g><path d="M347 692l13 5v10c0 8-5 13-13 17-8-4-13-9-13-17v-10z" fill="#131C2E" stroke="#5C6B87" stroke-width="2"/><text x="347" y="711" font-size="10" class="b" text-anchor="middle" style="fill:#C9D1D9">CSP</text><g class="blk"><path d="M347 692l13 5v10c0 8-5 13-13 17-8-4-13-9-13-17v-10z" fill="#131C2E" stroke="#F85149" stroke-width="2"/><text x="347" y="711" font-size="10" class="b" text-anchor="middle" style="fill:#fff">CSP</text><path d="M386 698l18 18m0-18l-18 18" stroke="#F85149" stroke-width="4.5" stroke-linecap="round"/><text x="61" y="739" font-size="16" class="b" style="fill:#F85149">fetch bloqueado (CSP)</text></g><g fill="none" stroke="#8B949E" stroke-width="2"><circle cx="511" cy="707" r="17"/><ellipse cx="511" cy="707" rx="8" ry="17"/><path d="M494 707h34"/></g><path d="M490 728L532 686" stroke="#F85149" stroke-width="3.5" stroke-linecap="round"/><text x="61" y="767" font-size="17" class="m">sem rede alé