-x),var(--y))}}@keyframes p3{0%,56%{opacity:0;transform:translate(0,0)}57%{opacity:1;transform:translate(0,0)}65%,66%{opacity:1;transform:translate(var(--x),var(--y))}67%,100%{opacity:0;transform:translate(var(--x),var(--y))}}@keyframes p4{0%,66%{opacity:0;transform:translate(0,0)}67%{opacity:1;transform:translate(0,0)}78%,97%{opacity:1;transform:translate(var(--x),var(--y))}98%,100%{opacity:0;transform:translate(var(--x),var(--y))}}@keyframes s1{0%,1%{opacity:0}2%,97%{opacity:1}98%,100%{opacity:0}}@keyframes s2{0%,3%{opacity:0}4%,97%{opacity:1}98%,100%{opacity:0}}@keyframes sw{0%,5%{opacity:0}6%,76%{opacity:1}77%,100%{opacity:0}}@keyframes sc{0%,78%{opacity:0}79%,82%{opacity:1}83%,100%{opacity:0}}@keyframes sd{0%,83%{opacity:0}84%,97%{opacity:1}98%,100%{opacity:0}}@keyframes cd{0%,35%{opacity:0}36%,97%{opacity:1}98%,100%{opacity:0}}@keyframes q1{0%,4%{opacity:0}5%,20%{opacity:1}21%,100%{opacity:0}}@keyframes q2{0%,23%{opacity:0}24%,32%{opacity:1}33%,100%{opacity:0}}@keyframes q3{0%,35%{opacity:0}36%,54%{opacity:1}55%,100%{opacity:0}}@keyframes q4{0%,57%{opacity:0}58%,64%{opacity:1}65%,100%{opacity:0}}@keyframes q5{0%,67%{opacity:0}68%,76%{opacity:1}77%,100%{opacity:0}}@keyframes q6{0%,79%{opacity:0}80%,95%{opacity:1}96%,100%{opacity:0}}@keyframes sv{0%,78%{opacity:0}79%,97%{opacity:1}98%,100%{opacity:0}}@keyframes gm{0%,1%{opacity:0}3%,9%{opacity:1}6%{opacity:.35}12%,18%{opacity:1}15%{opacity:.35}21%,78%{opacity:0}80%{opacity:1}83%{opacity:.35}86%{opacity:1}89%,100%{opacity:0}}@keyframes st{0%,34%{opacity:0}36%,40%{opacity:1}43%{opacity:.5}46%{opacity:1}49%{opacity:.5}52%,56%{opacity:1}60%,98%{opacity:.5}100%{opacity:0}}@keyframes bar{0%,35%{transform:scaleX(0)}54%,98%{transform:scaleX(1)}100%{transform:scaleX(0)}}@keyframes net{0%,46%{opacity:0}47%,97%{opacity:1}98%,100%{opacity:0}}@keyframes blk{0%,52%{opacity:0}53%,97%{opacity:1}98%,100%{opacity:0}}@media (prefers-reduced-motion:reduce){*{animation:none!important}.h.w1,.h.w2,.h.w4,.h.w5{opacity:1}.h.w3{opacity:.6}.pk{opacity:0}}</style>
