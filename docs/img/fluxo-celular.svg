<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 864" width="600" height="864" role="img">
<title>Fluxo entre o servidor e o navegador do visitante</title>
<desc>O servidor, com o agente, pede ao navegador do visitante que rode um código Python. A página repassa só o código e os dados a um Web Worker com Pyodide, que não tem rede além do caminho fixo do Pyodide; uma tentativa de acesso à internet é bloqueada pela política de segurança. A saída volta à página, que devolve o resultado ao servidor junto com um código de uso único, aceito uma vez. O servidor então confere cada número antes de responder. O servidor nunca executa o Python da IA.</desc>
