<circle cx="601" cy="158" r="5" fill="#39C5CF"/><text class="s" x="614" y="163" font-size="16" font-weight="600" fill="#39C5CF">Python</text><g class="o k21"><rect x="724" y="145" width="136" height="25" rx="12.5" fill="#39C5CF" fill-opacity=".12" stroke="#39C5CF" stroke-opacity=".7"/><rect x="735.05" y="152.04" width="13" height="11.05" rx="2" fill="none" stroke="#39C5CF" stroke-width="1.5"/><path d="M735.05 155.55h13" stroke="#39C5CF" stroke-width="1.5"/><text class="s" x="753.9" y="161.82" font-size="12" font-weight="600" fill="#39C5CF">no seu navegador</text></g><text class="m k22" x="596" y="192" font-size="13" fill="#C9D1D9">com = df[df.cupom].valor_pedido</text><text class="m k23" x="596" y="211" font-size="13" fill="#C9D1D9">sem = df[~df.cupom].valor_pedido</text><text class="m k24" x="596" y="230" font-size="13" fill="#C9D1D9"><tspan fill="#39C5CF">teste_t_welch</tspan>(com, sem)</text><rect x="596" y="242" width="260" height="6" rx="3" fill="#25324A"/><rect class="l k25" x="596" y="242" width="260" height="6" rx="3" fill="#39C5CF"/><g class="k26"><text class="m" x="596" y="283" font-size="24" font-weight="700" fill="#F0F6FC">p &lt; 0,001</text><text class="s" x="856" y="282" font-size="13" fill="#8B949E" text-anchor="end">significativa</text></g></g><g class="k27"><rect x="904" y="132" width="256" height="168" rx="12" fill="#172238" stroke="#25324A"/><rect x="924" y="131" width="44" height="3" rx="1.5" fill="#F0883E"/><circle cx="929" cy="158" r="5" fill="#F0883E"/><text class="s" x="942" y="163" font-size="16" font-weight="600" fill="#F0883E">Gráfico</text><text class="s" x="924" y="196" font-size="13" fill="#C9D1D9">com cupom</text><text class="s k29" x="1140" y="196" font-size="13" font-weight="700" fill="#F0883E" text-anchor="end">R$ 52,01</text><rect x="924" y="204" width="216" height="18" rx="4" fill="#25324A" fill-opacity=".6"/><rect class="l k30" x="924" y="204" width="175.8" height="18" rx="4" fill="#F0883E"/><text class="s" x="924" y="244" font-size="13" fill="#C9D1D9">sem cupom</text><text class="s k31" x="1140" y="244" font-size="13" font-weight="700" fill="#C9D1D9" text-anchor="end">R$ 63,90</text><rect x="924" y="252" width="216" height="18" rx="4" fill="#25324A" fill-opacity=".6"/><rect class="l k32" x="924" y="252" width="216.0" height="18" rx="4" fill="#5B6B86"/><text class="s" x="924" y="287" font-size="12" fill="#8B949E">ticket médio por pedido</text></g><rect class="h k7" x="40" y="132" width="230" height="168" rx="12" fill="none" stroke="#9085e9" stroke-width="1.5"/><rect class="h k13" x="298" y="132" width="250" height="168" rx="12" fill="none" stroke="#58A6FF" stroke-width="1.5"/><rect class="h k20" x="576" y="132" width="300" height="168" rx="12" fill="none" stroke="#39C5CF" stroke-width="1.5"/><rect class="h k28" x="904" y="132" width="256" height="168" rx="12" fill="none" stroke="#F0883E" stroke-width="1.5"/><circle class="h k33" cx="155" cy="318" r="5" fill="#F0F6FC"/><g class="h k34"><rect x="359" y="306" width="128" height="24" rx="12" fill="#0E1626" stroke="#39C5CF"/><text class="m" x="423" y="322" font-size="12" fill="#39C5CF" text-anchor="middle">código + dados</text></g><g class="o k35"><rect x="40" y="344" width="206" height="36" rx="18" fill="#3FB950" fill-opacity=".12" stroke="#3FB950" stroke-opacity=".6"/><circle cx="62" cy="362" r="11" fill="#3FB950"/><path class="d k36" pathLength="1" d="M56.5 362.5l3.85 3.85 7.15-7.7" fill="none" stroke="#131C2E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text class="s" x="81" y="367.1" font-size="15" font-weight="600" fill="#3FB950">números conferidos</text></g><circle class="h o k37" cx="62" cy="362" r="11" fill="none" stroke="#3FB950" stroke-width="2"/><text class="s k38" x="264" y="368" font-size="16" fill="#F0F6FC"><tspan font-weight="700">Sim:</tspan> com cupom o ticket médio é R$ 52,01, contra R$ 63,90 sem (p &lt; 0,001).</text><text class="s k39" x="1160" y="368" font-size="14" fill="#8B949E" text-anchor="end">cerca de <tspan fill="#F0F6FC" font-weight="600">17 s</tspan> · <tspan fill="#F0F6FC" font-weight="600">4</tspan> chamadas ao LLM · <tspan fill="#F0F6FC" font-weight="600">R$ 0</tspan></text></g></svg>