<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-labelledby="t d"><title id="t">Analista de dados com IA: da pergunta à resposta conferida</title><desc id="d">Uma pergunta é digitada: “Pedidos com cupom têm ticket médio diferente? A diferença é significativa?”. No servidor, o agente monta um plano e escreve o SQL que separa 1.620 pedidos com cupom e 6.380 sem. O código e os dados passam para o navegador de quem perguntou, onde o Python roda um teste t de Welch: p menor que 0,001. Um gráfico de barras compara o ticket médio, R$ 52,01 com cupom e R$ 63,90 sem; o selo “números conferidos” aparece e chega a resposta: sim, a diferença é significativa. Cerca de 17 segundos, 4 chamadas ao modelo de linguagem, custo zero.</desc><style>.s{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.m{font-family:ui-monospace,"Cascadia Mono",Consolas,monospace}.o{transform-box:fill-box;transform-origin:center}.l{transform-box:fill-box;transform-origin:0 50%}.h{opacity:0}.d{stroke-dasharray:1}@keyframes k1{0%,2.5%{transform:none;animation-timing-function:steps(74,end)}21.67%,100%{transform:translateX(888px)}}.k1{animation:k1 12s infinite}@keyframes k2{0%,2.5%{transform:translateX(-888px);animation-timing-function:steps(74,end)}21.67%,100%{transform:none}}.k2{animation:k2 12s infinite}@keyframes k3{0%{opacity:1}21.67%{opacity:0}25.83%{opacity:1}30%{opacity:0}34.17%{opacity:1}38.33%{opacity:0}42.5%{opacity:1}46.67%{opacity:0}50.83%{opacity:1}55%{opacity:0}59.17%{opacity:1}63.33%{opacity:0}67.5%{opacity:1}71.67%{opacity:0}75.83%{opacity:1}80%{opacity:0}84.17%{opacity:1}88.33%{opacity:0}91.67%,100%{opacity:0}}.k3{animation:k3 12s step-end infinite}@keyframes k4{0%,20.83%{opacity:0}23.33%,22.5%{opacity:0.45}26.67%,100%{opacity:0}}.k4{animation:k4 12s infinite}@keyframes k5{0%,41.25%{opacity:0}43.75%,44.58%{opacity:1}48.75%,100%{opacity:0}}.k5{animation:k5 12s infinite}@keyframes k6{0%,21.67%{opacity:0;transform:translate(0,14px)